server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: firefly-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: warehouse-service
              uri: ${WAREHOUSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
firefly:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  token-status-check-enabled: ${TOKEN_STATUS_CHECK_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:firefly-logistics-change-this-jwt-secret-in-production}
    issuer: ${JWT_ISSUER:firefly-logistics}
    audience: ${JWT_AUDIENCE:firefly-logistics-web}
management:
  endpoints:
    web:
      exposure:
        include: health,info
