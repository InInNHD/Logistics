server:
  port: ${PORT:${SERVER_PORT:8082}}
spring:
  application:
    name: warehouse-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/firefly_logistics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:firefly}
    password: ${DB_PASSWORD:firefly_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    table: flyway_warehouse_schema_history
    baseline-on-migrate: true
    baseline-version: 0
firefly:
  carrier:
    credential-key: ${CARRIER_CREDENTIAL_KEY:}
    scheduler-enabled: ${CARRIER_SYNC_SCHEDULER_ENABLED:true}
    scheduler-delay-ms: ${CARRIER_SYNC_SCHEDULER_DELAY_MS:60000}
    batch-size: ${CARRIER_SYNC_BATCH_SIZE:50}
    lease-minutes: ${CARRIER_SYNC_LEASE_MINUTES:5}
    max-attempts: ${CARRIER_SYNC_MAX_ATTEMPTS:3}
    retry-delay-ms: ${CARRIER_SYNC_RETRY_DELAY_MS:500}
    manual-min-interval-seconds: ${CARRIER_SYNC_MANUAL_COOLDOWN_SECONDS:5}
    circuit-failure-threshold: ${CARRIER_SYNC_CIRCUIT_THRESHOLD:3}
    circuit-cooldown-minutes: ${CARRIER_SYNC_CIRCUIT_COOLDOWN_MINUTES:15}
  security:
    enabled: ${WAREHOUSE_SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:firefly-logistics-change-this-jwt-secret-in-production}
    issuer: ${JWT_ISSUER:firefly-logistics}
    audience: ${JWT_AUDIENCE:firefly-logistics-web}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
