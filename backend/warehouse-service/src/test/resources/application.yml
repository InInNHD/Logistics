spring:
  datasource:
    url: jdbc:h2:mem:warehouse;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
firefly:
  carrier:
    credential-key: firefly-carrier-test-key-at-least-32-characters
    scheduler-enabled: false
    manual-min-interval-seconds: 0
  security:
    enabled: false
  jwt:
    secret: firefly-logistics-test-secret-must-have-32-bytes
    issuer: firefly-logistics-test
    audience: firefly-logistics-test-web
